apiVersion: gateway.kagenti.dev/v1alpha1
kind: AIGateway
metadata:
  name: ai-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
  providers:
    - name: openai
      endpoint: https://api.openai.com/v1
      schema: OpenAI
      credentialRef:
        name: openai-secret
      models:
        - gpt-4o
        - gpt-4o-mini
    - name: ollama
      endpoint: http://ollama.ollama.svc:11434
      schema: OpenAI
      models:
        - llama-3
  # Uncomment to enable SPIRE mTLS access control.
  # When set, only pods presenting a valid X.509-SVID from the configured
  # trust domain can connect to the gateway.
  # mtls:
  #   trustDomain: example.org
  #   trustBundleConfigMap:
  #     name: spire-bundle
  #     namespace: spire-system
  #     key: bundle.spiffe
  #   # Optional: reference a user-provided TLS serving certificate.
  #   # If omitted, the controller generates a self-signed certificate.
  #   # serverCertRef:
  #   #   name: my-tls-cert
