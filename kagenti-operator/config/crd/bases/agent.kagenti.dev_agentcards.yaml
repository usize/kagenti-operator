---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: agentcards.agent.kagenti.dev
spec:
  group: agent.kagenti.dev
  names:
    kind: AgentCard
    listKind: AgentCardList
    plural: agentcards
    shortNames:
    - agentcards
    - cards
    singular: agentcard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Agent Protocol
      jsonPath: .status.protocol
      name: Protocol
      type: string
    - description: Workload Kind
      jsonPath: .status.targetRef.kind
      name: Kind
      type: string
    - description: Target Workload
      jsonPath: .status.targetRef.name
      name: Target
      type: string
    - description: Agent Name
      jsonPath: .status.card.name
      name: Agent
      type: string
    - description: Signature Verified
      jsonPath: .status.validSignature
      name: Verified
      type: boolean
    - description: Identity Bound
      jsonPath: .status.bindingStatus.bound
      name: Bound
      type: boolean
    - description: Sync Status
      jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: Synced
      type: string
    - description: Last Sync Time
      jsonPath: .status.lastSyncTime
      name: LastSync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentCard is the Schema for the agentcards API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentCardSpec defines the desired state of AgentCard.
            properties:
              identityBinding:
                description: IdentityBinding specifies SPIFFE identity binding configuration
                properties:
                  allowedSpiffeIDs:
                    description: |-
                      AllowedSpiffeIDs is the allowlist of SPIFFE IDs that can bind to this agent.
                      Each ID must be a valid SPIFFE ID in the format spiffe://<trust-domain>/<path>
                    items:
                      description: SpiffeID represents a SPIFFE identity in the format
                        spiffe://<trust-domain>/<path>
                      pattern: ^spiffe://[a-zA-Z0-9][a-zA-Z0-9\-\.]*[a-zA-Z0-9](/[a-zA-Z0-9\-\._~%!$&'()*+,;=:@]+)*$
                      type: string
                    minItems: 1
                    type: array
                  expectedSpiffeID:
                    description: |-
                      ExpectedSpiffeID overrides the auto-derived SPIFFE ID for this workload.
                      Use this when your SPIRE configuration uses a non-standard identity format
                      (e.g., pod labels, container names, or other workload attestor selectors).
                      If not specified, the controller derives the ID as:
                        spiffe://<trust-domain>/ns/<namespace>/sa/<serviceAccount>
                      See: https://github.com/spiffe/spire/blob/main/doc/plugin_agent_workloadattestor_k8s.md
                    pattern: ^spiffe://[a-zA-Z0-9][a-zA-Z0-9\-\.]*[a-zA-Z0-9](/[a-zA-Z0-9\-\._~%!$&'()*+,;=:@]+)*$
                    type: string
                  strict:
                    default: false
                    description: |-
                      Strict enables strict enforcement mode. When true and binding fails,
                      the Agent controller will scale the deployment to 0.
                    type: boolean
                  trustDomain:
                    description: |-
                      TrustDomain overrides the controller's default trust domain.
                      Must be a valid DNS-like string without slashes.
                    pattern: ^[a-zA-Z0-9]([a-zA-Z0-9\-\.]*[a-zA-Z0-9])?$
                    type: string
                required:
                - allowedSpiffeIDs
                type: object
              selector:
                description: |-
                  Selector identifies the Agent to index using label matching.
                  Deprecated: Use TargetRef instead. Selector is kept for backward compatibility.
                  If both TargetRef and Selector are specified, TargetRef takes precedence.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels is a map of {key,value} pairs to match
                      against Agent labels
                    type: object
                required:
                - matchLabels
                type: object
              syncPeriod:
                default: 30s
                description: SyncPeriod is how often to re-fetch the agent card (e.g.,
                  "30s", "5m")
                type: string
              targetRef:
                description: |-
                  TargetRef identifies the workload backing this agent using duck typing.
                  The referenced workload must have the required Kagenti labels (kagenti.io/type=agent).
                  This is the preferred way to reference agent workloads.
                properties:
                  apiVersion:
                    description: APIVersion is the API version of the target resource
                      (e.g., "apps/v1")
                    minLength: 1
                    type: string
                  kind:
                    description: Kind is the kind of the target resource (e.g., "Deployment",
                      "StatefulSet")
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the target resource
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            type: object
          status:
            description: AgentCardStatus defines the observed state of AgentCard.
            properties:
              bindingStatus:
                description: BindingStatus contains the result of identity binding
                  evaluation
                properties:
                  bound:
                    description: Bound indicates whether the expected SPIFFE ID is
                      in the allowlist
                    type: boolean
                  lastEvaluationTime:
                    description: LastEvaluationTime is when the binding was last evaluated
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable description of the binding
                      status
                    type: string
                  reason:
                    description: Reason is a machine-readable reason for the binding
                      status
                    type: string
                required:
                - bound
                type: object
              card:
                description: Card contains the cached agent card data
                properties:
                  capabilities:
                    description: Capabilities specifies supported A2A features
                    properties:
                      pushNotifications:
                        description: PushNotifications indicates if the agent supports
                          push notifications
                        type: boolean
                      streaming:
                        description: Streaming indicates if the agent supports streaming
                          responses
                        type: boolean
                    type: object
                  defaultInputModes:
                    description: DefaultInputModes are the default media types the
                      agent accepts
                    items:
                      type: string
                    type: array
                  defaultOutputModes:
                    description: DefaultOutputModes are the default media types the
                      agent produces
                    items:
                      type: string
                    type: array
                  description:
                    description: Description provides information about what the agent
                      does
                    type: string
                  name:
                    description: Name is the human-readable name of the agent
                    type: string
                  signatures:
                    description: |-
                      Signatures contains JWS signatures per A2A spec section 8.4.2.
                      Each element uses JWS JSON Serialization with protected header containing
                      the algorithm (alg), key ID (kid), and optional SPIFFE ID (spiffe_id).
                    items:
                      description: |-
                        AgentCardSignature represents a JWS signature on an AgentCard.
                        Follows the A2A specification section 8.4.2 — JWS JSON Serialization.
                      properties:
                        header:
                          description: Header contains optional unprotected JWS header
                            parameters.
                          properties:
                            timestamp:
                              description: Timestamp is when the signature was created
                                (ISO 8601 string)
                              type: string
                          type: object
                        protected:
                          description: |-
                            Protected is the base64url-encoded JWS protected header.
                            Decoded, it contains {"alg":"RS256","kid":"key-1","spiffe_id":"spiffe://..."}.
                          type: string
                        signature:
                          description: |-
                            Signature is the base64url-encoded JWS signature value.
                            The signing input is: BASE64URL(protected) || '.' || BASE64URL(canonical_payload)
                          type: string
                      required:
                      - protected
                      - signature
                      type: object
                    type: array
                  skills:
                    description: Skills is a list of skills/capabilities this agent
                      offers
                    items:
                      description: AgentSkill represents a skill offered by the agent
                      properties:
                        description:
                          description: Description explains what this skill does
                          type: string
                        inputModes:
                          description: InputModes are the media types this skill accepts
                          items:
                            type: string
                          type: array
                        name:
                          description: Name is the identifier for this skill
                          type: string
                        outputModes:
                          description: OutputModes are the media types this skill
                            produces
                          items:
                            type: string
                          type: array
                        parameters:
                          description: Parameters defines the parameters this skill
                            accepts
                          items:
                            description: SkillParameter defines a parameter that a
                              skill accepts
                            properties:
                              default:
                                description: Default is the default value for this
                                  parameter
                                type: string
                              description:
                                description: Description explains what this parameter
                                  is for
                                type: string
                              name:
                                description: Name is the parameter name
                                type: string
                              required:
                                description: Required indicates if this parameter
                                  must be provided
                                type: boolean
                              type:
                                description: Type is the parameter type (e.g., "string",
                                  "number", "boolean", "object", "array")
                                type: string
                            type: object
                          type: array
                      type: object
                    type: array
                  supportsAuthenticatedExtendedCard:
                    description: SupportsAuthenticatedExtendedCard indicates if the
                      agent has an extended card
                    type: boolean
                  url:
                    description: URL is the endpoint where the A2A service can be
                      reached
                    type: string
                  version:
                    description: Version is the agent's version string
                    type: string
                type: object
              cardId:
                description: CardId is the SHA256 hash of the JCS-canonicalized card
                  content (optional drift detection)
                type: string
              conditions:
                description: Conditions represent the current state of the indexing
                  process
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expectedSpiffeID:
                description: ExpectedSpiffeID is the derived SPIFFE ID based on Kubernetes
                  metadata
                type: string
              lastSyncTime:
                description: LastSyncTime is when the agent card was last successfully
                  fetched
                format: date-time
                type: string
              protocol:
                description: Protocol is the detected agent protocol (e.g., "a2a")
                type: string
              signatureIdentityMatch:
                description: |-
                  SignatureIdentityMatch indicates if both signature AND identity binding pass.
                  true only when ValidSignature is true AND BindingStatus.Bound is true.
                type: boolean
              signatureKeyId:
                description: SignatureKeyID is the key ID used for verification (from
                  JWS protected header kid)
                type: string
              signatureSpiffeId:
                description: |-
                  SignatureSpiffeID is the SPIFFE ID extracted from the JWS protected header.
                  This enables cross-referencing the signer's identity with the identity binding evaluation.
                type: string
              signatureVerificationDetails:
                description: SignatureVerificationDetails contains details about the
                  last signature verification
                type: string
              targetRef:
                description: |-
                  TargetRef contains the resolved reference to the backing workload.
                  This is populated after the controller successfully locates the workload.
                properties:
                  apiVersion:
                    description: APIVersion is the API version of the target resource
                      (e.g., "apps/v1")
                    minLength: 1
                    type: string
                  kind:
                    description: Kind is the kind of the target resource (e.g., "Deployment",
                      "StatefulSet")
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the target resource
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              validSignature:
                description: ValidSignature indicates if the agent card signature
                  was validated
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
