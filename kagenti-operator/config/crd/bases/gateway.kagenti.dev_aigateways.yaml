---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: aigateways.gateway.kagenti.dev
spec:
  group: gateway.kagenti.dev
  names:
    kind: AIGateway
    listKind: AIGatewayList
    plural: aigateways
    shortNames:
    - aigw
    singular: aigateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Number of configured providers
      jsonPath: .status.configuredProviders
      name: Providers
      type: integer
    - description: Number of configured model routes
      jsonPath: .status.configuredModels
      name: Models
      type: integer
    - description: Gateway endpoint
      jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AIGateway is the Schema for the aigateways API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AIGatewaySpec defines the desired state of AIGateway.
            properties:
              gatewayClassName:
                description: GatewayClassName is the name of the GatewayClass (e.g.
                  "eg" for Envoy Gateway).
                minLength: 1
                type: string
              listeners:
                description: Listeners defines the Gateway API listener configuration.
                items:
                  description: AIGatewayListener defines a listener on the Gateway.
                  properties:
                    name:
                      description: Name is the listener name.
                      minLength: 1
                      type: string
                    port:
                      description: Port is the network port.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: HTTP
                      description: Protocol is the listener protocol (HTTP or HTTPS).
                      enum:
                      - HTTP
                      - HTTPS
                      type: string
                  required:
                  - name
                  - port
                  type: object
                minItems: 1
                type: array
              providers:
                description: Providers defines the LLM providers to route to.
                items:
                  description: AIGatewayProvider defines an LLM provider backend.
                  properties:
                    credentialKey:
                      default: api-key
                      description: CredentialKey is the key within the Secret (default
                        "api-key").
                      type: string
                    credentialRef:
                      description: |-
                        CredentialRef references a Secret containing the API key.
                        Omit for unauthenticated providers (e.g. local Ollama).
                      properties:
                        name:
                          description: Name is the Secret name.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    endpoint:
                      description: Endpoint is the provider API base URL or in-cluster
                        service address.
                      minLength: 1
                      type: string
                    models:
                      description: Models lists the model identifiers available from
                        this provider.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    name:
                      description: Name is a unique identifier for this provider (becomes
                        AIServiceBackend name).
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                      type: string
                    schema:
                      description: Schema is the API schema used by this provider.
                      enum:
                      - OpenAI
                      - Anthropic
                      - AWSBedrock
                      - AzureOpenAI
                      - GoogleGenAI
                      type: string
                  required:
                  - endpoint
                  - models
                  - name
                  - schema
                  type: object
                minItems: 1
                type: array
              mtls:
                description: |-
                  MTLS configures mutual TLS access control for the gateway.
                  When set, only clients presenting a valid X.509-SVID from the
                  configured SPIRE trust domain are allowed to connect.
                properties:
                  serverCertRef:
                    description: |-
                      ServerCertRef optionally references a Secret containing the gateway's
                      TLS serving certificate (tls.crt + tls.key). If omitted, the
                      controller generates a self-signed certificate.
                    properties:
                      name:
                        description: Name is the Secret name containing tls.crt and tls.key.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  trustBundleConfigMap:
                    description: |-
                      TrustBundleConfigMap references the ConfigMap containing the SPIRE
                      trust bundle in SPIFFE JSON format.
                    properties:
                      key:
                        default: bundle.spiffe
                        description: Key within the ConfigMap containing the SPIFFE JSON
                          bundle.
                        type: string
                      name:
                        description: Name of the ConfigMap.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  trustDomain:
                    description: |-
                      TrustDomain is the SPIRE trust domain (e.g. "example.org").
                      Only SVIDs with spiffe://<trustDomain>/... URI SANs are accepted.
                    minLength: 1
                    type: string
                required:
                - trustBundleConfigMap
                - trustDomain
                type: object
              service:
                description: Service configures the generated Gateway service.
                properties:
                  type:
                    default: ClusterIP
                    description: Type is the Kubernetes Service type.
                    enum:
                    - ClusterIP
                    - LoadBalancer
                    - NodePort
                    type: string
                type: object
            required:
            - gatewayClassName
            - listeners
            - providers
            type: object
          status:
            description: AIGatewayStatus defines the observed state of AIGateway.
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the AIGateway.
                  Known condition types: Ready, GatewayReady, RoutesConfigured.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              configuredModels:
                description: ConfiguredModels is the count of model routes configured.
                format: int32
                type: integer
              configuredProviders:
                description: ConfiguredProviders is the count of backends created.
                format: int32
                type: integer
              endpoint:
                description: Endpoint is the Gateway service endpoint URL.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
