apiVersion: v1
kind: Pod
metadata:
  name: curl-trusted
  namespace: team1
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: spiffe-certs
      mountPath: /spiffe-certs
      readOnly: true
  volumes:
  - name: spiffe-certs
    csi:
      driver: "csi.spiffe.io"
      readOnly: true
