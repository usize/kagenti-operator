apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: team1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: team1
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
